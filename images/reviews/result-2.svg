<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f1b30"/>
    </linearGradient>
    <linearGradient id="shine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a4f8f;stop-opacity:0.2"/>
      <stop offset="50%" style="stop-color:#6b9eff;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#2a4f8f;stop-opacity:0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  <!-- SUV silhouette -->
  <path d="M100,400 Q120,320 200,300 L280,260 Q340,230 450,230 L550,250 Q650,270 700,320 L730,400 Z" fill="#2d2d3d" stroke="#3a3a50" stroke-width="1"/>
  <path d="M260,290 Q290,240 380,230 L500,235 Q540,240 560,270 L570,300 Z" fill="#1e3a6e" opacity="0.35"/>
  <!-- Wheels -->
  <circle cx="230" cy="400" r="45" fill="#1a1a2a" stroke="#333" stroke-width="2"/>
  <circle cx="230" cy="400" r="28" fill="#222" stroke="#444" stroke-width="1"/>
  <circle cx="630" cy="400" r="45" fill="#1a1a2a" stroke="#333" stroke-width="2"/>
  <circle cx="630" cy="400" r="28" fill="#222" stroke="#444" stroke-width="1"/>
  <!-- Shine -->
  <rect x="180" y="260" width="420" height="90" fill="url(#shine2)" rx="8" opacity="0.5"/>
  <!-- Ground -->
  <rect x="0" y="445" width="800" height="155" fill="#111" opacity="0.5"/>
  <!-- Camera icon -->
  <g transform="translate(370,140)" opacity="0.3">
    <rect x="0" y="8" width="60" height="44" rx="6" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="30" cy="30" r="12" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M20,8 L24,0 L36,0 L40,8" fill="none" stroke="#fff" stroke-width="2"/>
  </g>
  <text x="400" y="210" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="14" font-weight="600" letter-spacing="2">CUSTOMER PHOTO</text>
</svg>
