<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#141428"/>
    </linearGradient>
    <linearGradient id="shine3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a4f8f;stop-opacity:0.25"/>
      <stop offset="50%" style="stop-color:#6b9eff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#2a4f8f;stop-opacity:0.25"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <!-- Sports car silhouette -->
  <path d="M130,410 Q150,350 260,330 L380,290 Q420,275 520,275 L620,300 Q690,320 710,360 L720,410 Z" fill="#2d2d3d" stroke="#3a3a50" stroke-width="1"/>
  <path d="M300,325 Q330,285 400,278 L520,280 Q560,285 575,305 L580,330 Z" fill="#1e3a6e" opacity="0.35"/>
  <!-- Wheels -->
  <circle cx="260" cy="410" r="38" fill="#1a1a2a" stroke="#333" stroke-width="2"/>
  <circle cx="260" cy="410" r="24" fill="#222" stroke="#444" stroke-width="1"/>
  <circle cx="630" cy="410" r="38" fill="#1a1a2a" stroke="#333" stroke-width="2"/>
  <circle cx="630" cy="410" r="24" fill="#222" stroke="#444" stroke-width="1"/>
  <!-- Shine -->
  <rect x="210" y="295" width="400" height="70" fill="url(#shine3)" rx="8" opacity="0.5"/>
  <!-- Ground -->
  <rect x="0" y="448" width="800" height="152" fill="#111" opacity="0.5"/>
  <!-- Camera icon -->
  <g transform="translate(370,150)" opacity="0.3">
    <rect x="0" y="8" width="60" height="44" rx="6" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="30" cy="30" r="12" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M20,8 L24,0 L36,0 L40,8" fill="none" stroke="#fff" stroke-width="2"/>
  </g>
  <text x="400" y="220" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="14" font-weight="600" letter-spacing="2">CUSTOMER PHOTO</text>
</svg>
